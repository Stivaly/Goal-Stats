<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
        }
        p {
            font-size: 1.5rem;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>La página que estás buscando no existe.</p>
        <p><a href="/">Volver al inicio</a></p>
        <script>
            // Redirigir automáticamente a la ruta correcta si el usuario está navegando por una URL desconocida
            (function() {
                const pathname = window.location.pathname;
                const routes = [
                    "/dashboard",
                    "/usuarios",
                    "/billing",
                    "/virtual-reality",
                    "/profile",
                    "/rtl-page",
                    "/sign-in",
                    "/sign-up"
                ];

                if (routes.includes(pathname)) {
                    window.location.replace(pathname);
                } else {
                    window.location.replace("/");
                }
            })();
        </script>
    </div>
</body>
</html>
